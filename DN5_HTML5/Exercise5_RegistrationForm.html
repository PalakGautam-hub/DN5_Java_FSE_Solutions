<!-- Exercise 5: Event Registration Form -->

<!DOCTYPE html>
<html>
<body>

<form onsubmit="msg.value='Registration Successful'">

<input type="text"
       placeholder="Name"
       required
       autofocus>

<br><br>

<input type="email"
       placeholder="Email"
       required>

<br><br>

<input type="date"
       required>

<br><br>

<select>

<option>Workshop</option>
<option>Seminar</option>
<option>Festival</option>

</select>

<br><br>

<textarea placeholder="Message"></textarea>

<br><br>

<button type="submit">
Submit
</button>

<output name="msg"></output>

</form>

</body>
</html>
